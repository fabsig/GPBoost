name: Conclusion probe

# Temporary: finds out which conclusion GitHub gives a run in which one job succeeds and another one
# is stopped by 'timeout-minutes', and whether that sends a notification. Delete this file once the
# result is known.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  succeeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: exit 0

  times-out:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: sleep 180
