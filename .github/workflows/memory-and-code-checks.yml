name: Memory and code checks

# The checks of 'helpers/check_R_package_rhub.R' in the R-hub containers. They are far too slow for
# every commit and are therefore started by hand, from the "Actions" tab or with
# 'gh workflow run memory-and-code-checks.yml -f valgrind=16', and once a month on their own.
#
# The monthly runs are spread over the Sundays of the month so that they never compete for the
# runners: ASan, UBSan and rchk on the first Sunday, valgrind on the third. The cron below fires on
# every Sunday and the 'select' job decides which of the two, if either, the date belongs to;
# combining the two conditions in cron itself is not possible, because a day of the month and a day
# of the week are combined with OR and not with AND.
#
# A job on a GitHub-hosted runner is killed after 6 hours. The instrumented code is roughly 2x
# slower than a normal build, and under valgrind 20-50x, with all threads serialized onto one core.
# The whole test suite therefore does not fit into one job under valgrind, and it is tight under
# ASan.
#
# Inside a single check there is nothing left to parallelize: valgrind emulates one CPU and runs all
# threads of the process on it, and testthat works through the test files one after the other. The
# run time is shortened by distributing the test FILES over several jobs instead, which run on
# separate runners at the same time. Each of the three containers is selected by the number of jobs
# its test files are spread over, or by 'off'; 'test_filter' narrows the suite down to the files of
# interest before it is distributed, and 'all_tests' switches the suite off completely.
#
# On the number of shards: the CI workflow already needs four of them for the uninstrumented suite
# on the same runners, so four is the smallest number that gives an ASan run a comfortable margin,
# and it is the default for the two ASan containers. valgrind is so much slower that it needs 12 or
# more, which is why the number is chosen per container: one dispatch can run the ASan checks over
# four jobs and valgrind over sixteen. Every shard installs the dependencies and compiles the
# package again, which is what limits the gain from going much higher. A run may not ask for more
# than 20 jobs at once, which is the limit of the plan.
#
# valgrind is off by default, and deliberately so: ASan already covers buffer overflows and
# use-after-free, its own contribution is the reads of uninitialized memory, and even spread over
# sixteen jobs it occupies most of the twenty runners for hours, which then queues the CI runs of
# every push. It is meant to be started on its own, for a release or after a change to the memory
# handling, not next to the ASan checks.
#
# Note that every test file of the package is gated on 'GPBOOST_ALL_TESTS'. With 'all_tests' off,
# not a single test runs and only the examples of the help pages exercise the library, which is what
# CRAN sees; this is useful as a quick first run, not as a check of the library.
on:
  schedule:
    # every Sunday at 00:00 UTC; only the first and the third Sunday of a month select any check
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      clang_asan_ubsan:
        description: "ASan and UBSan with clang ('clang-asan' image): number of jobs, or off"
        type: choice
        default: "4"
        options: ["off", "1", "2", "4", "8", "12", "16"]
      gcc_asan_ubsan:
        description: "ASan, UBSan and bounds-strict with gcc ('gcc-asan' image): number of jobs, or off"
        type: choice
        default: "4"
        options: ["off", "1", "2", "4", "8", "12", "16"]
      valgrind:
        description: "valgrind (memcheck, very slow): number of jobs, or off"
        type: choice
        default: "off"
        options: ["off", "1", "2", "4", "8", "12", "16"]
      # rchk neither runs the tests nor is influenced by the shards, it compiles the package once
      # and analyzes the bitcode, so it costs a single short job and is on by default
      rchk:
        description: "rchk container (use of the R C API)"
        type: boolean
        default: true
      clang_warnings:
        description: "compiler warnings with clang"
        type: boolean
        default: false
      all_tests:
        description: "run the test suite (GPBOOST_ALL_TESTS), not only the examples"
        type: boolean
        default: true
      test_filter:
        description: "regular expression for the test files to run, e.g. '^GPModel_.*' (empty: all)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Every run gets its own group, so that a run is never held back by another one. A shared group
  # queues a dispatch behind a run that is still going, and since a valgrind shard occupies a runner
  # for hours, a quick ASan run started in the meantime would wait for the whole of it.
  # The jobs of a run do compete for the runners, but that is already bounded: the 'select' job
  # refuses a run that asks for more jobs than can execute at once
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:

  select:
    name: Select the containers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
      rchk: ${{ steps.select.outputs.rchk }}
      clang_warnings: ${{ steps.select.outputs.clang_warnings }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # the three containers below are all driven by the 'r-check' script, only their arguments
      # differ, so they are run by one matrix job that is assembled here, with one entry per
      # container and shard. The two checks that are not driven by it are decided here as well, so
      # that a scheduled run, which has no inputs, selects them in the same place
      - name: Build the matrix from the selected checks
        id: select
        env:
          EVENT: ${{ github.event_name }}
          CLANG_ASAN_UBSAN: ${{ inputs.clang_asan_ubsan }}
          GCC_ASAN_UBSAN: ${{ inputs.gcc_asan_ubsan }}
          VALGRIND: ${{ inputs.valgrind }}
          RCHK: ${{ inputs.rchk }}
          CLANG_WARNINGS: ${{ inputs.clang_warnings }}
          ALL_TESTS: ${{ inputs.all_tests }}
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          python3 - >> "${GITHUB_OUTPUT}" <<'PY'
          import datetime, json, os, re, sys

          test_dir = "R-package/tests/testthat"
          scheduled = os.environ["EVENT"] == "schedule"

          if scheduled:
              # a scheduled run carries no inputs, so the defaults of the dispatch form do not apply
              # and the selection is made from the date instead. The cron fires on every Sunday; the
              # first one of a month falls on a day between 1 and 7, the third one between 15 and 21
              day = datetime.datetime.now(datetime.timezone.utc).day
              if 1 <= day <= 7:
                  settings = {"CLANG_ASAN_UBSAN": "4", "GCC_ASAN_UBSAN": "4", "VALGRIND": "off",
                              "RCHK": "true", "CLANG_WARNINGS": "false"}
              elif 15 <= day <= 21:
                  settings = {"CLANG_ASAN_UBSAN": "off", "GCC_ASAN_UBSAN": "off", "VALGRIND": "16",
                              "RCHK": "false", "CLANG_WARNINGS": "false"}
              else:
                  settings = {"CLANG_ASAN_UBSAN": "off", "GCC_ASAN_UBSAN": "off", "VALGRIND": "off",
                              "RCHK": "false", "CLANG_WARNINGS": "false"}
              os.environ.update(settings, ALL_TESTS="true", TEST_FILTER="")
              print(f"scheduled run on day {day} of the month: {settings}", file=sys.stderr)

          all_tests = os.environ["ALL_TESTS"] == "true"
          user_filter = os.environ["TEST_FILTER"]

          # the filter of testthat is matched against the file name without the leading 'test_' and
          # without the extension
          names = sorted(
              re.sub(r"[.][rR]$", "", re.sub(r"^test[-_]", "", f))
              for f in os.listdir(test_dir)
              if re.match(r"^test.*[.][rR]$", f)
          )
          if user_filter:
              names = [n for n in names if re.search(user_filter, n)]
              if not names:
                  raise SystemExit(f"no test file matches '{user_filter}'")

          def filter_of(shard, num_shards):
              if num_shards == 1:
                  return user_filter
              # the files are dealt out one by one over the shards, which spreads the long ones
              # without knowing how long they take, as the CI workflow does
              chosen = names[shard - 1::num_shards]
              return "^(" + "|".join(n.replace(".", "[.]") for n in chosen) + ")$"

          # the number of shards is given per container: valgrind needs many more of them than the
          # ASan containers, and one dispatch should be able to run both
          containers = [
              ("clang-asan-ubsan", "ghcr.io/r-hub/containers/clang-asan", os.environ["CLANG_ASAN_UBSAN"]),
              ("gcc-asan-ubsan", "ghcr.io/r-hub/containers/gcc-asan", os.environ["GCC_ASAN_UBSAN"]),
              ("valgrind", "ghcr.io/r-hub/containers/valgrind", os.environ["VALGRIND"]),
          ]

          entries = []
          for name, image, shards in containers:
              if shards == "off":
                  continue
              # without 'GPBOOST_ALL_TESTS' the test files skip themselves and only the examples of
              # the help pages are left, and those are run by every shard in full: sharding would
              # then multiply the work instead of dividing it
              num_shards = int(shards) if all_tests else 1
              for shard in range(1, num_shards + 1):
                  # the valgrind container defines 'CHECK_ARGS' itself, and replacing it without
                  # '--use-valgrind' would run a plain check in which nothing is examined at all,
                  # while still looking successful. Its default is therefore kept as it is for a
                  # single job, and reproduced literally when a shard has to be appended to it
                  if name == "valgrind":
                      args = "" if num_shards == 1 else "--use-valgrind --extra-arch --no-stop-on-test-error"
                  else:
                      args = "--no-manual --no-build-vignettes"
                  # the examples are not split up, so only the first shard runs them
                  if num_shards > 1 and shard > 1:
                      args += " --no-examples"
                  entries.append({
                      "name": name if num_shards == 1 else f"{name} (shard {shard} of {num_shards})",
                      "id": name if num_shards == 1 else f"{name}-{shard}-of-{num_shards}",
                      "image": image,
                      "check_args": args,
                      # The default 'VALGRIND_OPTS' of the container contain '--leak-check=full',
                      # which is what CRAN runs, and a manual run keeps it. The monthly run drops
                      # the leak check instead and concentrates on the reads of uninitialized memory,
                      # which is what valgrind contributes over ASan: R does not run all of its
                      # finalizers at the end, so whatever is still alive is reported as lost, and
                      # those records say nothing about the correctness of the library
                      "valgrind_opts": "--track-origins=yes --leak-check=no"
                                       if (name == "valgrind" and scheduled) else "",
                      "all_tests": "true" if all_tests else "false",
                      "test_filter": filter_of(shard, num_shards) if all_tests else "",
                      "timeout": 350,
                  })

          # beyond the concurrency limit of the plan the remaining jobs wait for a free runner, and
          # a check that is spread over more shards than can run at once is slower than a narrower
          # one, not faster. rchk and the warning check run next to the matrix and take a runner
          # each, so they are counted here as well
          others = sum(os.environ[v] == "true" for v in ("RCHK", "CLANG_WARNINGS"))
          if len(entries) + others > 20:
              raise SystemExit(
                  f"{len(entries) + others} jobs were requested, at most 20 can run at once"
              )

          matrix = json.dumps({"include": entries})
          print(f"matrix={matrix}")
          print("any=" + ("true" if entries else "false"))
          print("rchk=" + os.environ["RCHK"])
          print("clang_warnings=" + os.environ["CLANG_WARNINGS"])
          print(json.dumps({"include": entries}, indent=2), file=sys.stderr)
          PY

  r-check:
    name: ${{ matrix.name }}
    needs: select
    if: needs.select.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      # the images are several GB and the check unpacks and compiles the whole package next to them
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Build the CRAN source package
        run: |
          sh build-cran-package.sh
          ls -l gpboost_*.tar.gz

      # 'r-check' installs the dependencies of the package (including 'Suggests', so that the tests
      # are really run) and runs 'R CMD check'.
      #
      # Its exit status is deliberately NOT used as the verdict. The script runs under 'set -e' and
      # determines the files it has to search with
      #     testfiles=$(ls tests | grep ".Rout.fail$")
      # A check in which every test passed has no '.Rout.fail' at all, 'grep' then exits with 1, and
      # 'set -e' ends the script with that status: a completely clean run is reported as a failure.
      # The script also searches only '<package>-Ex.Rout' and the '.Rout.fail' files, so a report of
      # a sanitizer in a test file that passed, which lands in '.Rout', is not seen by it at all.
      # The verdict is therefore formed in the step below, from the whole check directory.
      # The containers set 'OMP_THREAD_LIMIT=2', as CRAN does; this is deliberately not raised, it
      # makes the reports more reproducible
      - name: Run the check in the ${{ matrix.name }} container
        env:
          NAME: ${{ matrix.id }}
          IMAGE: ${{ matrix.image }}
          CHECK_ARGS: ${{ matrix.check_args }}
          ALL_TESTS: ${{ matrix.all_tests }}
          TEST_FILTER: ${{ matrix.test_filter }}
          VALGRIND_OPTS: ${{ matrix.valgrind_opts }}
        run: |
          # a 'CHECK_ARGS' for the valgrind container that has lost '--use-valgrind' would run a
          # plain check in which nothing is examined, and 'r-check' would then find no valgrind
          # output and report success
          case "${NAME}" in
            valgrind*)
              if [ -n "${CHECK_ARGS}" ] && ! echo "${CHECK_ARGS}" | grep -q -- "--use-valgrind"; then
                echo "::error::CHECK_ARGS for the valgrind container does not contain --use-valgrind"
                exit 1
              fi
              ;;
            *)
              opts=(-e ASAN_OPTIONS=detect_leaks=0 -e UBSAN_OPTIONS=print_stacktrace=1)
              ;;
          esac
          opts+=(--rm -v "${PWD}:/check" -e MAKEFLAGS=-j4 -e GPBOOST_STRICT_TOLERANCES=false)
          if [ "${ALL_TESTS}" = "true" ]; then
            opts+=(-e GPBOOST_ALL_TESTS=GPBOOST_ALL_TESTS)
          fi
          if [ -n "${TEST_FILTER}" ]; then
            echo "test files of this shard: ${TEST_FILTER}"
            opts+=(-e GPBOOST_TEST_FILTER="${TEST_FILTER}")
          fi
          if [ -n "${CHECK_ARGS}" ]; then
            opts+=(-e CHECK_ARGS="${CHECK_ARGS}")
          fi
          # only set for the monthly valgrind run, a manual one keeps the default of the container
          if [ -n "${VALGRIND_OPTS}" ]; then
            echo "VALGRIND_OPTS: ${VALGRIND_OPTS}"
            opts+=(-e VALGRIND_OPTS="${VALGRIND_OPTS}")
          fi
          docker run "${opts[@]}" "${IMAGE}" r-check && status=0 || status=$?
          # 'r-check' installs the dependencies of the package before it runs the check, and that
          # download fails from time to time ("Failed to download ps ... error in pak subprocess").
          # Such a run is repeated, but only when '00check.log' does not exist yet, i.e. when
          # 'R CMD check' had not started: a check that did run is never repeated, a valgrind shard
          # takes hours and would not fit into the job a second time
          if [ "${status}" -ne 0 ] && [ ! -f gpboost.Rcheck/00check.log ]; then
            echo "::warning::the check did not start, repeating it once"
            rm -rf gpboost.Rcheck
            docker run "${opts[@]}" "${IMAGE}" r-check && status=0 || status=$?
          fi
          echo "r-check exited with ${status}"

      # The sanitizers write nothing when they find nothing, so "Status: OK" only means that the
      # code is clean if the tests really ran. A suite that skipped itself reports
      # '[ FAIL 0 | WARN 0 | SKIP 20 | PASS 1 ]' and would otherwise pass as a silent no-op, which
      # is what is turned into a failure here
      - name: Check that the tests really ran
        if: always()
        env:
          ALL_TESTS: ${{ matrix.all_tests }}
        run: |
          summary=$(grep -hE "^\[ FAIL" gpboost.Rcheck/tests/*.Rout gpboost.Rcheck/tests/*.Rout.fail 2>/dev/null || true)
          if [ -z "${summary}" ]; then
            echo "no testthat summary in the check output"
            if [ "${ALL_TESTS}" = "true" ]; then
              echo "::error::the test suite produced no summary, so nothing was examined"
              exit 1
            fi
            exit 0
          fi
          echo "${summary}"
          if [ "${ALL_TESTS}" = "true" ]; then
            passed=$(echo "${summary}" | sed -n "s/.*PASS \([0-9]*\).*/\1/p" | head -1)
            if [ "${passed:-0}" -le 1 ]; then
              echo "::error::only ${passed:-0} expectations ran, the suite skipped itself"
              exit 1
            fi
          fi

      # This step forms the verdict of the job, because the exit status of 'r-check' cannot carry it
      # (see the step above). It counts the findings by kind, writes them to the summary of the run,
      # and fails when a sanitizer or valgrind reported something or when 'R CMD check' did not end
      # with "Status: OK". A failure of this job can mean quite different things - a report of one of
      # the sanitizers, a test whose expected values do not hold for this build, or a check step that
      # did not finish - and they all look the same in the list of jobs, which is what the table is
      # for.
      # The leak records of valgrind are counted separately on purpose. R does not free all of its
      # memory and the default 'VALGRIND_OPTS' of the container contain '--leak-check=full', so a
      # run can report leaks without a single access to uninitialized or foreign memory. They are
      # listed but they do not fail the job on their own.
      - name: Summarize what was reported
        if: always()
        env:
          NAME: ${{ matrix.name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          root = pathlib.Path("gpboost.Rcheck")
          kinds = [
              ("AddressSanitizer", r"ERROR: AddressSanitizer|AddressSanitizer: "),
              ("UBSan runtime error", r"runtime error: "),
              ("valgrind, uninitialized or invalid memory",
               r"uninitialised value|Invalid (read|write|free)|Mismatched free"),
              ("valgrind, leak record", r"(definitely|indirectly|possibly) lost"),
              ("failed test expectation", r"^Failure \(|^Error \("),
          ]
          counts = {name: 0 for name, _ in kinds}
          if root.is_dir():
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix not in (".Rout", ".fail", ".log", ".out"):
                      continue
                  text = path.read_text(errors="replace")
                  for name, pattern in kinds:
                      counts[name] += len(re.findall(pattern, text, re.MULTILINE))

          status = ""
          check_log = root / "00check.log"
          if check_log.is_file():
              found = re.findall(r"^Status: .*$", check_log.read_text(errors="replace"), re.MULTILINE)
              status = found[-1] if found else ""

          lines = [f"### {os.environ['NAME']}", "", f"`{status or 'no Status line in 00check.log'}`", ""]
          if any(counts.values()):
              lines += ["| reported | count |", "| --- | --- |"]
              lines += [f"| {name} | {n} |" for name, n in counts.items() if n]
          else:
              lines.append("Nothing was reported by the sanitizers, by valgrind or by the tests.")
          lines += ["", "The full `gpboost.Rcheck` folder is attached to this run as an artifact."]

          report = "\n".join(lines)
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write(report + "\n\n")

          problems = [name for name, n in counts.items()
                      if n and name != "valgrind, leak record"]
          if problems:
              print("::error::" + ", ".join(problems))
          if not status:
              print("::error::'R CMD check' produced no Status line, it did not finish")
          elif status != "Status: OK":
              print(f"::error::{status}")
          if problems or status != "Status: OK":
              raise SystemExit(1)
          PY

      - name: Upload the check directory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpboost-Rcheck-${{ matrix.id }}
          path: gpboost.Rcheck
          retention-days: 14

  rchk:
    name: rchk
    needs: select
    if: needs.select.outputs.rchk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Build the CRAN source package
        run: |
          sh build-cran-package.sh

      # rchk does not run the tests, it compiles the package and analyzes the bitcode. 'r-check'
      # does not turn its findings into a non-zero exit status, so the output is searched here.
      # A run without findings prints no '[UP]' or '[PB]' line at all; the three "too many states"
      # errors that it does print are in functions of R itself
      - name: Run rchk
        run: |
          set -o pipefail
          docker run --rm -v "${PWD}:/check" -e MAKEFLAGS=-j4 \
            ghcr.io/r-hub/containers/rchk r-check 2>&1 | tee rchk.log
          if grep -qE "^\[(UP|PB|PC)\]" rchk.log; then
            echo "::error::rchk reported findings"
            grep -E "^\[(UP|PB|PC)\]" rchk.log
            exit 1
          fi
          if ! grep -q "rchk bcheck" rchk.log; then
            echo "::error::rchk did not run, see the log"
            exit 1
          fi

      - name: Upload the rchk log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rchk-log
          path: rchk.log
          retention-days: 14

  clang-warnings:
    name: Compiler warnings (clang)
    needs: select
    if: needs.select.outputs.clang_warnings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # the rchk container is used here simply because it contains a clang; 'libomp-14-dev' supplies
      # the 'omp.h' of clang's OpenMP runtime, which the image does not have, and '-w /check' is
      # needed because the script changes into the directory of its own parent
      - name: Compile with clang and the warning options of the helper script
        run: |
          docker run --rm -v "${PWD}:/check" -w /check ghcr.io/r-hub/containers/rchk \
            sh -c "apt-get update -qq && apt-get install -y -qq libomp-14-dev > /dev/null 2>&1 && CXX=clang++ sh helpers/check_compiler_warnings.sh"
