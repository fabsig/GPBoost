name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential graphviz

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest psutil matplotlib graphviz

      - name: Build and install GPBoost
        run: |
          python -m pip install ./python-package

      - name: Run Python tests
        run: |
          pytest -q tests/python_package_test


  r-tests:
    name: R package tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::R6
            any::data.table
            any::RJSONIO
            any::Matrix
            any::processx
            any::testthat

      - name: Build and install GPBoost R package
        run: |
          Rscript build_r.R

      - name: Run full R test suite
        env:
          GPBOOST_ALL_TESTS: GPBOOST_ALL_TESTS
          GPBOOST_STRICT_TOLERANCES: "false"
        run: |
          Rscript -e 'library(gpboost); options(testthat.summary.max_reports = 100); testthat::test_dir("R-package/tests/testthat", reporter = "summary", stop_on_failure = TRUE)'