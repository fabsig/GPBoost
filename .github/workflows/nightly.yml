name: Nightly

# the jobs here are either slow or cover a platform that is not needed for every commit, so they
# run once a night on master and on request
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:

  python-tests-other-platforms:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install graphviz --no-progress -y

      # libomp is needed for the OpenMP support of the library, Apple clang does not ship it
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp graphviz

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest psutil numpy pandas scipy scikit-learn joblib packaging matplotlib graphviz

      - name: Build and install GPBoost
        run: |
          python -m pip install ./python-package

      - name: Run Python tests
        run: |
          pytest -q tests/python_package_test

  r-tests-slow:
    name: R tests including the slow extras
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      MAKEFLAGS: "-j4"
      # CMake reads these for 'CMAKE_<LANG>_COMPILER_LAUNCHER', which is how the CMake calls that are
      # made by 'src/install.libs.R' are routed through ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::R6
            any::data.table
            any::RJSONIO
            any::Matrix
            any::processx
            any::testthat

      # 'src/install.libs.R' builds the library with CMake, also on Linux, so the compile rules of R
      # (and a '~/.R/Makevars') never see it: ccache is wired in through the compiler launcher and
      # through the symlinks that the action puts in front of the compilers on the PATH
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: r-tests-slow
          create-symlink: true

      - name: Build and install the R package
        run: |
          Rscript build_r.R

      # 'GPBOOST_ADDITIONAL_SLOW_TESTS' adds the cases that the CI workflow leaves out, everything
      # else is the same suite that runs there on every commit
      - name: Run the R test suite
        env:
          GPBOOST_ALL_TESTS: GPBOOST_ALL_TESTS
          GPBOOST_ADDITIONAL_SLOW_TESTS: GPBOOST_ADDITIONAL_SLOW_TESTS
          GPBOOST_STRICT_TOLERANCES: "false"
        run: |
          Rscript -e 'library(gpboost); options(testthat.summary.max_reports = 100); testthat::test_dir("R-package/tests/testthat", reporter = "summary", stop_on_failure = TRUE)'

  cran-check:
    name: R CMD check --as-cran (no manual)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      MAKEFLAGS: "-j4"
      _R_CHECK_FORCE_SUGGESTS_: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential qpdf

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::R6
            any::data.table
            any::RJSONIO
            any::Matrix
            any::processx
            any::testthat
            any::rcmdcheck

      # the tests of the package skip themselves when 'GPBOOST_ALL_TESTS' is not set, which is what
      # CRAN sees as well; the full suite is run by the R test jobs of the CI workflow.
      # 'R CMD check' returns 0 for a check that only has warnings, so the exit status is determined
      # by rcmdcheck instead, which fails on a warning as well
      - name: Build and check the CRAN source package
        run: |
          sh build-cran-package.sh
          Rscript -e '
            tarball <- Sys.glob("gpboost_*.tar.gz")
            stopifnot(length(tarball) == 1L)
            rcmdcheck::rcmdcheck(tarball, args = c("--as-cran", "--no-manual"),
                                 error_on = "warning", check_dir = "check")
          '

      - name: Upload the check directory
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gpboost-Rcheck
          path: check/gpboost.Rcheck
          retention-days: 7
